name: Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # GATE: version consistency (tag pushes only)
  # ---------------------------------------------------------------------------
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INIT_VERSION=$(grep '__version__' ansible_forge/__init__.py | sed 's/.*"\(.*\)".*/\1/')

          echo "Tag:        $TAG_VERSION"
          echo "pyproject:  $PYPROJECT_VERSION"
          echo "tauri.conf: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          echo "__init__:   $INIT_VERSION"

          FAIL=0
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch: tag ($TAG_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            FAIL=1
          fi
          if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Version mismatch: tag ($TAG_VERSION) != tauri.conf.json ($TAURI_VERSION)"
            FAIL=1
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag ($TAG_VERSION) != Cargo.toml ($CARGO_VERSION)"
            FAIL=1
          fi
          if [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch: tag ($TAG_VERSION) != ansible_forge/__init__.py ($INIT_VERSION)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Fix version strings before tagging. All must match."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "All versions match: $TAG_VERSION"

  # ---------------------------------------------------------------------------
  # STAGE 1: test (always runs; waits for preflight on tag pushes)
  # ---------------------------------------------------------------------------
  test:
    needs: [preflight]
    if: always() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Backend lint
        run: ruff check ansible_forge/ tests/

      - name: Backend type check
        run: mypy ansible_forge/ --ignore-missing-imports

      - name: Backend tests
        run: pytest tests/ -v --tb=short --ignore=tests/integration

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short -m integration
        timeout-minutes: 3

      - name: Frontend install
        working-directory: ui
        run: npm ci

      - name: Frontend type check
        working-directory: ui
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: ui
        run: npm test

      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust check and lint
        working-directory: src-tauri
        run: |
          cargo check
          cargo clippy -- -D warnings

  # ---------------------------------------------------------------------------
  # STAGE 2: build-mac-arm64 (tag only)
  # ---------------------------------------------------------------------------
  build-mac-arm64:
    needs: [test, preflight]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Bundle backend with PyInstaller
        run: pyinstaller --clean --noconfirm ansibleforge.spec

      - name: Smoke test packaged backend
        run: bash scripts/smoke_test.sh
        timeout-minutes: 3

      - name: Copy backend to Tauri resources
        run: |
          mkdir -p src-tauri/resources/backend
          cp -r dist/ansibleforge-backend/* src-tauri/resources/backend/
          chmod +x src-tauri/resources/backend/ansibleforge-backend
          ls -lh src-tauri/resources/backend/

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.MAC_CERT_P12_BASE64 }}" ]; then
            export APPLE_CERTIFICATE="${{ secrets.MAC_CERT_P12_BASE64 }}"
            export APPLE_CERTIFICATE_PASSWORD="${{ secrets.MAC_CERT_PASSWORD }}"
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          cargo tauri build --target aarch64-apple-darwin --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/release-mac
          find src-tauri/target -name '*.dmg' -exec cp {} /tmp/release-mac/ \;
          find src-tauri/target -name '*.app.tar.gz' -exec cp {} /tmp/release-mac/ \;
          find src-tauri/target -name '*.app.tar.gz.sig' -exec cp {} /tmp/release-mac/ \;
          ls -lh /tmp/release-mac/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64
          path: /tmp/release-mac/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STAGE 2: build-linux (tag only)
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [test, preflight]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Bundle backend with PyInstaller
        run: pyinstaller --clean --noconfirm ansibleforge.spec

      - name: Smoke test packaged backend
        run: bash scripts/smoke_test.sh
        timeout-minutes: 3

      - name: Copy backend to Tauri resources
        run: |
          mkdir -p src-tauri/resources/backend
          cp -r dist/ansibleforge-backend/* src-tauri/resources/backend/
          chmod +x src-tauri/resources/backend/ansibleforge-backend
          ls -lh src-tauri/resources/backend/

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/release-linux
          find src-tauri/target -name '*.AppImage' -exec cp {} /tmp/release-linux/ \;
          find src-tauri/target -name '*.AppImage.tar.gz' -exec cp {} /tmp/release-linux/ \;
          find src-tauri/target -name '*.AppImage.tar.gz.sig' -exec cp {} /tmp/release-linux/ \;
          find src-tauri/target -name '*.deb' -exec cp {} /tmp/release-linux/ \;
          ls -lh /tmp/release-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: /tmp/release-linux/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STAGE 2: build-windows (tag only)
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [test, preflight]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set Windows UTF-8 locale
        run: |
          [System.Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001

      - name: Bundle backend with PyInstaller
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          PYTHONLEGACYWINDOWSSTDIO: "0"
        shell: cmd
        run: |
          chcp 65001
          set PYTHONUTF8=1
          set PYTHONIOENCODING=utf-8
          pyinstaller --clean --noconfirm ansibleforge.spec

      - name: Smoke test packaged backend (Windows)
        shell: bash
        run: |
          BACKEND="./dist/ansibleforge-backend/ansibleforge-backend.exe"
          if [ ! -f "$BACKEND" ]; then
            echo "FAIL: Backend binary not found"; exit 1
          fi
          echo "=== Starting backend ==="
          ANSIBLEFORGE_PORT=18420 ANSIBLEFORGE_HOST=127.0.0.1 "$BACKEND" &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:18420/api/v1/health" > /dev/null 2>&1; then
              echo "=== Backend healthy after ${i}s ==="
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FAIL: Backend never became healthy"
              kill $PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          HEALTH=$(curl -sf "http://127.0.0.1:18420/api/v1/health")
          echo "Health: $HEALTH"
          echo "=== Checking CA bundle ==="
          CA="./dist/ansibleforge-backend/_internal/certifi/cacert.pem"
          if [ -f "$CA" ]; then
            echo "  OK: cacert.pem present"
          else
            echo "  WARN: cacert.pem not at expected path"
          fi
          kill $PID 2>/dev/null || true
          echo "=== Windows smoke test passed ==="
        timeout-minutes: 3

      - name: Copy backend to Tauri resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/backend
          cp -r dist/ansibleforge-backend/* src-tauri/resources/backend/
          ls -lh src-tauri/resources/backend/

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'

      - name: Collect artifacts
        shell: bash
        run: |
          OUTDIR="${{ runner.temp }}/release-windows"
          mkdir -p "$OUTDIR"
          find src-tauri/target -name '*.msi' -exec cp {} "$OUTDIR" \;
          find src-tauri/target -name '*.msi.zip' -exec cp {} "$OUTDIR" \;
          find src-tauri/target -name '*.msi.zip.sig' -exec cp {} "$OUTDIR" \;
          find src-tauri/target -name '*.exe' -path '*/nsis/*' -exec cp {} "$OUTDIR" \;
          find src-tauri/target -name '*-setup.nsis.zip' -exec cp {} "$OUTDIR" \;
          find src-tauri/target -name '*-setup.nsis.zip.sig' -exec cp {} "$OUTDIR" \;
          ls -lh "$OUTDIR"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-windows/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STAGE 3: publish GitHub Release (tag only)
  # ---------------------------------------------------------------------------
  publish:
    needs: [build-mac-arm64, build-linux, build-windows, preflight]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-mac-arm64.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac-arm64
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums and release body
        id: release_body
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          cd artifacts

          echo "=== Generating SHA256 checksums ==="
          sha256sum * > SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "=== Building release body ==="

          {
            echo "## Downloads"
            echo ""
            echo "| Platform | File | Size |"
            echo "|----------|------|------|"

            for f in *.dmg; do
              [ -f "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1 | xargs)
              echo "| macOS (Apple Silicon) | \`$f\` | $SIZE |"
            done

            for f in *.AppImage; do
              [ -f "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1 | xargs)
              echo "| Linux (AppImage) | \`$f\` | $SIZE |"
            done

            for f in *.deb; do
              [ -f "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1 | xargs)
              echo "| Linux (Debian) | \`$f\` | $SIZE |"
            done

            for f in *.msi; do
              [ -f "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1 | xargs)
              echo "| Windows (MSI) | \`$f\` | $SIZE |"
            done

            for f in *setup*.exe; do
              [ -f "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1 | xargs)
              echo "| Windows (Installer) | \`$f\` | $SIZE |"
            done

            echo ""
            echo "## Install"
            echo ""
            echo "### macOS (Apple Silicon)"
            echo "Download the \`.dmg\`, open it, drag **Tuyere** to Applications."
            echo ""
            echo "### Linux"
            echo "**AppImage:**"
            echo "\`\`\`"
            echo "chmod +x Tuyere-*.AppImage"
            echo "./Tuyere-*.AppImage"
            echo "\`\`\`"
            echo "**Debian/Ubuntu:**"
            echo "\`\`\`"
            echo "sudo dpkg -i tuyere_*.deb"
            echo "\`\`\`"
            echo ""
            echo "### Windows"
            echo "Run the \`.msi\` installer or the NSIS \`.exe\` setup."
            echo ""
            echo "## Checksums (SHA256)"
            echo "\`\`\`"
            cat SHA256SUMS.txt
            echo "\`\`\`"
            echo ""
            echo "## What Changed"
          } > /tmp/release_body.md

          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "v${VERSION}" ]; then
            echo "Changelog since $PREV_TAG:" >> /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            git log --oneline "${PREV_TAG}..HEAD" >> /tmp/release_body.md
          else
            echo "Initial release." >> /tmp/release_body.md
          fi

          cat /tmp/release_body.md

      - name: Generate Tauri updater manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd artifacts

          get_sig() {
            local sigfile="$1"
            if [ -f "$sigfile" ]; then
              cat "$sigfile"
            else
              echo ""
            fi
          }

          REPO="https://github.com/avijra/ansibleForge/releases/download/v${VERSION}"

          MAC_TAR=$(ls *.app.tar.gz 2>/dev/null | head -1 || true)
          MAC_SIG=$(get_sig "${MAC_TAR}.sig" 2>/dev/null || true)

          LINUX_APPIMAGE_TAR=$(ls *.AppImage.tar.gz 2>/dev/null | head -1 || true)
          LINUX_APPIMAGE_SIG=$(get_sig "${LINUX_APPIMAGE_TAR}.sig" 2>/dev/null || true)

          WIN_MSI_ZIP=$(ls *.msi.zip 2>/dev/null | head -1 || true)
          WIN_MSI_SIG=$(get_sig "${WIN_MSI_ZIP}.sig" 2>/dev/null || true)

          WIN_NSIS_ZIP=$(ls *-setup.nsis.zip 2>/dev/null | head -1 || true)
          WIN_NSIS_SIG=$(get_sig "${WIN_NSIS_ZIP}.sig" 2>/dev/null || true)

          cat > latest.json <<MANIFEST
          {
            "version": "v${VERSION}",
            "notes": "Tuyere v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${REPO}/${MAC_TAR}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_APPIMAGE_SIG}",
                "url": "${REPO}/${LINUX_APPIMAGE_TAR}"
              },
              "windows-x86_64": {
                "signature": "${WIN_MSI_SIG}",
                "url": "${REPO}/${WIN_MSI_ZIP}"
              }
            }
          }
          MANIFEST

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tuyere v${{ needs.preflight.outputs.version }}"
          body_path: /tmp/release_body.md
          draft: false
          files: |
            artifacts/*.dmg
            artifacts/*.app.tar.gz
            artifacts/*.app.tar.gz.sig
            artifacts/*.AppImage
            artifacts/*.AppImage.tar.gz
            artifacts/*.AppImage.tar.gz.sig
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.msi.zip
            artifacts/*.msi.zip.sig
            artifacts/*-setup*.exe
            artifacts/*-setup.nsis.zip
            artifacts/*-setup.nsis.zip.sig
            artifacts/latest.json
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
