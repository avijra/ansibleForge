[project]
name = "ansible-forge"
version = "5.0.0"
description = "The definitive AI agent harness for Ansible — generate, validate, execute, and manage any Ansible workflow through natural language."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AnsibleForge Contributors" }]
keywords = ["ansible", "agent", "automation", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "litellm>=1.50.0",
    "ansible-runner>=2.4.0",
    "ansible-core>=2.17.0",
    "ansible-lint>=24.10.0",
    "Jinja2>=3.1.0",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
molecule = ["molecule>=24.9.0", "molecule-plugins[docker]>=23.5.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "types-PyYAML>=6.0.0",
]
all = ["ansible-forge[molecule,dev]"]

[project.scripts]
ansible-forge = "ansible_forge.main:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "A002"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise real subprocess calls and network (may be slow)",
    "e2e: end-to-end tests validating full agent workflows with mock LLM",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ansible_forge.agent.orchestrator",
    "ansible_forge.tools.galaxy_manager",
    "ansible_forge.tools.git_manager",
    "ansible_forge.tools.log_analyzer",
    "ansible_forge.tools.template_renderer",
    "ansible_forge.tools.terraform_executor",
    "ansible_forge.tools.terraform_inventory",
]
ignore_errors = true
